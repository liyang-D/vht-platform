<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VHT ACE Prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header><span class="eyebrow">VHT APP</span><h1>ACE-III local prototype</h1>
      <p class="warning">Research prototype — not clinically validated.</p></header>
    <section id="setup" class="card">
      <h2>Session setup</h2>
      <form id="start-form">
        <div class="grid">
          <label>Participant name<input name="patient_name" required value="Synthetic Participant" /></label>
          <label>Date of birth<input name="dob" required value="1970-01-01" /></label>
          <label>Assessor<input name="assessor" required value="Internal tester" /></label>
          <label>Building/floor<input name="number" required value="4" /></label>
          <label>Street<input name="street" required value="Hospital Road" /></label>
          <label>Town<input name="town" required value="Canterbury" /></label>
          <label>County<input name="county" required value="Kent" /></label>
          <label>Country<input name="country" required value="England" /></label>
          <label>Current UK PM<input name="uk_pm" required /></label>
          <label>Current US president<input name="us_president" required /></label>
          <label>Previous UK PM<input name="previous_uk_pm" /></label>
          <label>Previous US president<input name="previous_us_president" /></label>
        </div>
        <label class="check"><input type="checkbox" name="synthesize" checked /> Generate local TTS</label>
        <button>Start assessment</button>
      </form>
      <form id="resume-form"><label>Existing session ID<input id="resume-id" /></label><button class="secondary">Resume checkpoint</button></form>
    </section>
    <section id="session" class="card hidden">
      <div class="status"><span id="status-dot"></span><span id="status-text">Starting</span></div>
      <h2 id="prompt">Preparing the first question…</h2>
      <audio id="audio" controls autoplay></audio>
      <img id="stimulus" class="hidden" alt="Assessment stimulus" />
      <div id="controls">
        <div id="audio-controls" class="hidden"><button id="record">Record answer</button><button id="stop" disabled>Done</button></div>
        <div id="image-controls" class="hidden"><video id="camera" autoplay playsinline></video><button id="capture">Capture drawing</button></div>
        <div id="video-controls" class="hidden"><video id="video-preview" autoplay muted playsinline></video><button id="record-video">Record action</button><button id="stop-video" disabled>Done</button></div>
        <div id="click-controls" class="click-grid hidden"></div>
        <form id="text-form"><input id="text-answer" placeholder="Typed/replay answer" /><button>Submit text</button></form>
      </div>
      <button id="pause" class="secondary">Save checkpoint</button>
      <pre id="error"></pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
