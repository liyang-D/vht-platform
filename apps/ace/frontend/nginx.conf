server {
    listen 80;
    server_name _;
    client_max_body_size 34m;

    location /api/ {
        proxy_pass http://ace-backend:8070/api/;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /stimuli/ {
        proxy_pass http://ace-backend:8070/stimuli/;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
